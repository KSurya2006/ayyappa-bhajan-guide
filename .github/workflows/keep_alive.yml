name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render free-tier instance from sleeping (15-min timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping to Render Backend
        run: |
          echo "Sending keep-alive ping to Render backend..."
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://ayyappa-bhajan-guide-backend.onrender.com/health" || echo "failed")
          echo "Render HTTP Response Status: $response"
